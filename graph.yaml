version: "1.0.0"
title: Shippo (test mode)
description: >-
  Shippo's REST API at https://api.goshippo.com, in test mode. Requests are JSON, authenticated with
  the API token as `Authorization: ShippoToken <token>`, and pinned to an API version with the
  SHIPPO-API-VERSION header. Every object carries `object_id`, `object_created`, a free-text
  `metadata` of up to 100 characters, and `test`, which is true for a test token. Lists page with
  `page` and `results` and answer `{results, next, previous}`, where `next` is a full URL and both
  `next` and `previous` are null at the ends, though the spec types them as strings. Errors are a
  flat `{"detail": "..."}` or a per-field map. Every node names its operation in Shippo's own
  OpenAPI spec, and the environments check each request and response against it.

oas: openapi/public-api.yaml

nodes:

  # --- Carrier accounts -------------------------------------------------------------------
  listCarrierAccounts:
    description: >-
      Page the carrier accounts the token can rate with (GET /carrier_accounts, 200). A clean test
      account has 15, every one active, `test: true`, and `is_shippo_account: true`, so no carrier
      credentials are needed to rate or buy. Ten of them actually answer a rate request; see
      docs/carrier-lane-coverage.md for which, and why the other five do not. `service_levels: true`
      adds each account's service levels, which is the only way to see them. Proven by
      plans/carriers/accounts.yaml.
    adapter: listCarrierAccounts
    tags: [carriers]
    oas:
      operationId: ListCarrierAccounts
    inputs:
      - name: serviceLevels
        type: boolean
        optional: true
        description: Include each account's service levels
      - name: carrier
        type: string
        optional: true
        description: Only accounts for this carrier token, such as usps
      - name: page
        type: integer
        optional: true
      - name: pageSize
        type: integer
        default: 100
        description: Accounts per page, 1 to 100
        constraints:
          min: 1
          max: 100
    outputs:
      - name: accounts
        type: carrierAccount[]
        elementFields:
          - name: carrierAccountId
            type: string
          - name: carrier
            type: string
          - name: active
            type: boolean
      - name: count
        type: integer
        display: Carriers
      - name: activeCount
        type: integer
      - name: shippoAccountCount
        type: integer
        description: Accounts Shippo provides itself, which need no carrier credentials
      - name: serviceLevelCount
        type: integer
        description: Service levels across the page; 0 unless serviceLevels was set
      - name: carriers
        type: string
        description: The page's carrier tokens, sorted and comma-joined
      - name: liveCount
        type: integer
        description: Accounts not in test mode on the page; 0 for a test token
      - name: nextPage
        type: integer
        optional: true
        description: The page number in the `next` URL; left out on the last page

  getCarrierAccount:
    description: >-
      Read one carrier account by its object id (GET /carrier_accounts/{id}, 200). Carries the
      carrier token and display name, whether it is active, and whether Shippo provides it — but
      **not its service levels**, which come back only from the listing with `service_levels: true`.
      Proven by plans/carriers/accounts.yaml.
    adapter: getCarrierAccount
    tags: [carriers]
    oas:
      operationId: GetCarrierAccount
    inputs:
      - name: carrierAccountId
        type: string
        default:
          from: listCarrierAccounts.accounts
          select:
            strategy: first
            field: carrierAccountId
    outputs:
      - name: carrierAccountId
        type: string
      - name: carrier
        type: string
        display: Carrier
      - name: accountId
        type: string
        description: >-
          Shippo's own identifier for the account, which with `carrier` forms its unique key.
          Neither can be changed, so an update has to send both back unaltered.
      - name: carrierName
        type: string
      - name: active
        type: boolean
      - name: isShippoAccount
        type: boolean
      - name: test
        type: boolean
      - name: serviceLevelCount
        type: integer
        description: Always 0 here; a single read carries no service levels
      - name: serviceLevels
        type: string
        description: Always "" here; the listing with serviceLevels set is the only source

  # --- Carrier parcel templates -----------------------------------------------------------
  listCarrierParcelTemplates:
    description: >-
      Every parcel template the carriers publish (GET /parcel-templates, 200). A test account sees
      74, from USPS, UPS, FedEx, DHL eCommerce, DPD UK, and Aramex Australia. The answer is a bare
      `{results}` with no `next` or `previous`, so it does not page. A template's token is what
      createParcel takes in place of dimensions. Proven by plans/carriers/parcel-templates.yaml.
    adapter: listCarrierParcelTemplates
    tags: [carriers, parcels]
    oas:
      operationId: ListCarrierParcelTemplates
    inputs:
      - name: carrier
        type: string
        optional: true
        description: Only templates for this carrier token
      - name: include
        type: string
        optional: true
        description: 'Narrow the list; "all" returns every template'
    outputs:
      - name: templates
        type: parcelTemplate[]
        elementFields:
          - name: token
            type: string
          - name: carrier
            type: string
          - name: name
            type: string
      - name: count
        type: integer
        display: Templates
      - name: carriers
        type: string
        description: The carriers that publish them, sorted and comma-joined
      - name: fixedCount
        type: integer
        description: Templates whose dimensions are fixed rather than variable

  getCarrierParcelTemplate:
    description: >-
      Read one carrier parcel template by its token (GET /parcel-templates/{token}, 200), such as
      USPS_FlatRateEnvelope. Carries the carrier, the display name, the dimensions with their unit,
      and whether the dimensions vary. Proven by plans/carriers/parcel-templates.yaml.
    adapter: getCarrierParcelTemplate
    tags: [carriers, parcels]
    oas:
      operationId: GetCarrierParcelTemplate
    inputs:
      - name: templateToken
        type: string
        default:
          from: listCarrierParcelTemplates.templates
          select:
            strategy: first
            field: token
    outputs:
      - name: token
        type: string
        display: Template
      - name: carrier
        type: string
      - name: name
        type: string
      - name: length
        type: string
      - name: width
        type: string
      - name: height
        type: string
      - name: distanceUnit
        type: string
      - name: isVariableDimensions
        type: boolean

  # --- Addresses --------------------------------------------------------------------------
  createAddress:
    description: >-
      Create an address (POST /addresses, 201). Only `country` is required to create one, but a
      purchase needs name, street1, city, zip, and a phone and email for some carriers, and
      `is_complete` says whether it has them. With `validate: true` Shippo corrects the address as
      it creates it — "1 Market Stret, San Fransisco" came back "1 Market St, San Francisco" with
      the ZIP+4 — and **drops `metadata`**, so a validated address cannot carry the package's tag.
      Addresses cannot be deleted, so nothing cleans them up; they are tagged instead. Proven by
      plans/addresses/create-and-read.yaml and plans/addresses/validate.yaml.
    adapter: createAddress
    tags: [addresses]
    oas:
      operationId: CreateAddress
    # A live token would create a real address; stop at the first one.
    errorDetection:
      - path: test
        rule: equals
        value: false
    inputs:
      - name: country
        type: string
        description: An ISO 3166-1 alpha-2 code, such as US or DE
      - name: name
        type: string
        optional: true
      - name: company
        type: string
        optional: true
        description: Required by CouriersPlease on a from address
      - name: street1
        type: string
        optional: true
      - name: street2
        type: string
        optional: true
      - name: city
        type: string
        optional: true
      - name: state
        type: string
        optional: true
        description: Required for US, CA, and AU; most carriers take two or three characters
      - name: zip
        type: string
        optional: true
      - name: phone
        type: string
        optional: true
      - name: email
        type: string
        optional: true
      - name: isResidential
        type: boolean
        optional: true
      - name: validate
        type: boolean
        optional: true
        description: Correct the address while creating it; Shippo then drops metadata
      - name: metadata
        type: string
        default: aat-shippo
        description: Up to 100 characters; every object this package creates carries its name
    outputs:
      - name: addressId
        type: string
        display: Address
      - name: name
        type: string
      - name: company
        type: string
      - name: street1
        type: string
      - name: city
        type: string
      - name: state
        type: string
      - name: zip
        type: string
      - name: country
        type: string
      - name: isComplete
        type: boolean
        description: Whether the address has everything a label purchase needs
      - name: test
        type: boolean
      - name: metadata
        type: string
        description: '"" for an address created with validate: true'
      - name: validationIsValid
        type: boolean
        optional: true
        description: Present only when the address was created with validate; Shippo's verdict
      - name: validationMessageCount
        type: integer
        description: Validator messages returned with the address; 0 when it was not validated

  getAddress:
    description: >-
      Read an address by its object id (GET /addresses/{id}, 200). An address is immutable once
      created, so this answers exactly what the create did. Proven by
      plans/addresses/create-and-read.yaml.
    adapter: getAddress
    tags: [addresses]
    oas:
      operationId: GetAddress
    inputs:
      - name: addressId
        type: string
        default:
          from: createAddress.addressId
    outputs:
      - name: addressId
        type: string
      - name: name
        type: string
      - name: street1
        type: string
      - name: city
        type: string
      - name: state
        type: string
      - name: zip
        type: string
      - name: country
        type: string
      - name: isComplete
        type: boolean
      - name: test
        type: boolean
      - name: metadata
        type: string

  listAddresses:
    description: >-
      Page the account's addresses (GET /addresses, 200), newest first. `next` is a full URL
      carrying the next page number and `previous` is null on the first page, though the spec types
      both as strings. Each page counts the addresses this package created, by their metadata tag,
      and any not in test mode. Proven by plans/addresses/create-and-read.yaml.
    adapter: listAddresses
    tags: [addresses, pagination]
    oas:
      operationId: ListAddresses
    inputs:
      - name: page
        type: integer
        optional: true
      - name: pageSize
        type: integer
        default: 25
        description: Addresses per page, 1 to 100
        constraints:
          min: 1
          max: 100
    outputs:
      - name: addresses
        type: address[]
        elementFields:
          - name: addressId
            type: string
          - name: country
            type: string
      - name: count
        type: integer
        display: Addresses
      - name: ourCount
        type: integer
        display: Ours
        description: Addresses on the page whose metadata starts aat-shippo
      - name: liveCount
        type: integer
        description: Addresses not in test mode on the page; 0 for a test token
      - name: nextPage
        type: integer
        optional: true
        description: The page number in the `next` URL; left out on the last page

  validateAddress:
    description: >-
      Validate an address that already exists (GET /addresses/{id}/validate, 200). Shippo answers a
      **new** address object with its own object id, the corrected fields, and
      `validation_results.messages`, each with a source, a code, and text. A valid address can still
      carry a message: a correct street with no apartment number comes back `is_valid: true` with
      "Default Match — More information, such as an apartment or suite number, may give a more
      specific address." Proven by plans/addresses/validate.yaml.
    adapter: validateAddress
    tags: [addresses, validation]
    oas:
      operationId: ValidateAddress
    inputs:
      - name: addressId
        type: string
        default:
          from: createAddress.addressId
    outputs:
      - name: addressId
        type: string
        display: Validated
        description: A new object id, not the one that was validated
      - name: isValid
        type: boolean
      - name: messageCount
        type: integer
      - name: messageCodes
        type: string
        description: The validator message codes, sorted and comma-joined
      - name: messageText
        type: string
        description: The first message's text; "" when there are none
      - name: street1
        type: string
      - name: city
        type: string
      - name: zip
        type: string
      - name: isComplete
        type: boolean
      - name: test
        type: boolean

  # --- Parcels ----------------------------------------------------------------------------
  createParcel:
    description: >-
      Create a parcel (POST /parcels, 201). The body is one of two shapes: explicit dimensions with
      `length`, `width`, `height`, and `distance_unit`, or a carrier's `template` token, which
      supplies them. Both need `weight` and `mass_unit`. Dimensions and weight are strings, not
      numbers. The parcel decides which carriers will rate a shipment at all, not just the price:
      a 15 g letter reaches Deutsche Post and a 30 cm box reaches Chronopost, where a 2 lb box
      reaches neither. Parcels cannot be deleted, so nothing cleans them up. Proven by
      plans/parcels/create-and-read.yaml and plans/parcels/from-template.yaml.
    adapter: createParcel
    tags: [parcels]
    oas:
      operationId: CreateParcel
    # A live token would create a real parcel; stop at the first one.
    errorDetection:
      - path: test
        rule: equals
        value: false
    inputs:
      - name: weight
        type: string
        default: "2"
      - name: massUnit
        type: string
        default: lb
        description: g, oz, lb, or kg
      # The defaults describe an everyday 10 x 8 x 4 in, 2 lb box. A plan that cares about the
      # parcel sets its own; the parcel-* layers set these inputs and nothing else, so a matrix can
      # cross them with anything.
      - name: length
        type: string
        optional: true
        default: "10"
      - name: width
        type: string
        optional: true
        default: "8"
      - name: height
        type: string
        optional: true
        default: "4"
      - name: distanceUnit
        type: string
        optional: true
        default: in
        description: cm, in, ft, mm, m, or yd
      - name: template
        type: string
        optional: true
        description: >-
          A carrier parcel template token, in place of the dimensions. A plan that sends one clears
          the dimension inputs with {} so the body writes a single shape.
      - name: metadata
        type: string
        default: aat-shippo
    outputs:
      - name: parcelId
        type: string
        display: Parcel
      - name: length
        type: string
      - name: width
        type: string
      - name: height
        type: string
      - name: distanceUnit
        type: string
      - name: weight
        type: string
      - name: massUnit
        type: string
      - name: template
        type: string
        description: The template token the parcel was built from; "" for explicit dimensions
      - name: objectState
        type: string
      - name: test
        type: boolean
      - name: metadata
        type: string

  getParcel:
    description: >-
      Read a parcel by its object id (GET /parcels/{id}, 200). A parcel is immutable, so this
      answers what the create did, with the dimensions a template supplied filled in. Proven by
      plans/parcels/create-and-read.yaml.
    adapter: getParcel
    tags: [parcels]
    oas:
      operationId: GetParcel
    inputs:
      - name: parcelId
        type: string
        default:
          from: createParcel.parcelId
    outputs:
      - name: parcelId
        type: string
      - name: length
        type: string
      - name: width
        type: string
      - name: height
        type: string
      - name: distanceUnit
        type: string
      - name: weight
        type: string
      - name: massUnit
        type: string
      - name: template
        type: string
      - name: objectState
        type: string
      - name: test
        type: boolean
      - name: metadata
        type: string

  listParcels:
    description: >-
      Page the account's parcels (GET /parcels, 200), newest first. Pages like the other listings.
      Each page counts the parcels this package created and any not in test mode. Proven by
      plans/parcels/create-and-read.yaml.
    adapter: listParcels
    tags: [parcels, pagination]
    oas:
      operationId: ListParcels
    inputs:
      - name: page
        type: integer
        optional: true
      - name: pageSize
        type: integer
        default: 25
        constraints:
          min: 1
          max: 100
    outputs:
      - name: parcels
        type: parcel[]
        elementFields:
          - name: parcelId
            type: string
          - name: massUnit
            type: string
      - name: count
        type: integer
        display: Parcels
      - name: ourCount
        type: integer
        display: Ours
      - name: liveCount
        type: integer
      - name: nextPage
        type: integer
        optional: true

  # --- Transactions, for the guard --------------------------------------------------------
  listTransactions:
    description: >-
      Page the labels the account has bought (GET /transactions, 200). `object_created_gte` narrows
      the list to labels created at or after an ISO 8601 UTC time, which is how the guard looks only
      at what this package could have bought; the spec declares that filter on this operation and on
      ListShipments alone. Each page counts the labels this package bought and any bought with a
      live token, which is the one unrecoverable mistake. Proven by
      plans/zz-guard/no-live-labels.yaml.
    adapter: listTransactions
    tags: [transactions, pagination, guard]
    oas:
      operationId: ListTransactions
    inputs:
      - name: page
        type: integer
        optional: true
      - name: pageSize
        type: integer
        default: 100
        constraints:
          min: 1
          max: 100
      - name: createdGte
        type: string
        optional: true
        description: Only labels created at or after this ISO 8601 UTC time
      - name: objectStatus
        type: string
        optional: true
        description: QUEUED, WAITING, SUCCESS, ERROR, or REFUNDED
    outputs:
      - name: transactions
        type: transaction[]
        optional: true
        elementFields:
          - name: transactionId
            type: string
          - name: status
            type: string
      - name: count
        type: integer
        display: Labels
      - name: ourCount
        type: integer
        display: Ours
        description: Labels on the page whose metadata starts aat-shippo
      - name: ourLabels
        type: ourLabel[]
        optional: true
        description: The package's labels on the page, when there are any, so a guard can name them
        elementFields:
          - name: transactionId
            type: string
          - name: status
            type: string
      - name: ourUnrefundedCount
        type: integer
        description: >-
          The package's labels still in SUCCESS — bought and not refunded. A label cannot be
          deleted, so this, not a count of what is left, is what a guard checks.
      - name: ourUnrefunded
        type: ourLabel[]
        optional: true
        description: Those labels, when there are any, so a failing guard can name them
        elementFields:
          - name: transactionId
            type: string
          - name: status
            type: string
      - name: liveCount
        type: integer
        description: Labels on the page not in test mode; a live token bought a real label
      - name: nextPage
        type: integer
        optional: true

  # --- Shipments and rating ---------------------------------------------------------------
  createShipment:
    description: >-
      Create a shipment and rate it (POST /shipments, 201). It takes a from address, a to address,
      and a list of parcel ids, each as an object id. Shippo documents rating as asynchronous and
      gives the shipment a `status` of QUEUED, WAITING, SUCCESS, or ERROR for it, but in test mode
      every lane probed answered SUCCESS with its rates already attached. A carrier that cannot serve
      the shipment does not fail the request: it leaves a line in `messages` saying why, and the rate
      simply is not there — so a rate count is the evidence, never an error. Shipments cannot be
      deleted. Proven by plans/rating/rate-shop.yaml.
    adapter: createShipment
    tags: [shipments, rating]
    oas:
      operationId: CreateShipment
    # A live token would rate a real shipment; stop at the first one.
    errorDetection:
      - path: test
        rule: equals
        value: false
    inputs:
      - name: addressFrom
        type: string
        default:
          from: createAddress.addressId
      - name: addressTo
        type: string
      - name: parcels
        type: string[]
        description: One or more parcel object ids
      - name: async
        type: boolean
        optional: true
        description: 'false rates before answering; Shippo''s default is true'
      - name: shipmentDate
        type: string
        optional: true
      - name: carrierAccounts
        type: string[]
        optional: true
        description: Rate only these carrier accounts, by object id, instead of all of them
      - name: customsDeclaration
        type: string
        optional: true
        description: Required by some carriers on an international lane
      - name: metadata
        type: string
        default: aat-shippo
    outputs:
      - name: shipmentId
        type: string
        display: Shipment
      - name: status
        type: string
        description: QUEUED, WAITING, SUCCESS, or ERROR
      - name: rateCount
        type: integer
        display: Rates
      - name: providers
        type: string
        description: The carriers that answered, sorted and comma-joined
      - name: messageCount
        type: integer
        description: Lines explaining why a carrier did not answer
      - name: addressFrom
        type: string
      - name: addressTo
        type: string
      - name: parcelCount
        type: integer
      - name: test
        type: boolean
      - name: metadata
        type: string

  getShipment:
    description: >-
      Read a shipment by its object id (GET /shipments/{id}, 200), with whatever rating has produced
      so far. This is what a poll reads while `status` is QUEUED or WAITING; in test mode it is
      SUCCESS on the first read. Proven by plans/rating/rate-shop.yaml.
    adapter: getShipment
    tags: [shipments, rating]
    oas:
      operationId: GetShipment
    inputs:
      - name: shipmentId
        type: string
        default:
          from: createShipment.shipmentId
    outputs:
      - name: shipmentId
        type: string
      - name: status
        type: string
        display: Status
      - name: rateCount
        type: integer
      - name: providers
        type: string
      - name: messageCount
        type: integer
      - name: test
        type: boolean
      - name: metadata
        type: string

  listShipments:
    description: >-
      Page the account's shipments (GET /shipments, 200). One of only two operations whose spec
      declares `object_created_gte`, the other being ListTransactions. Proven by
      plans/rating/rate-shop.yaml.
    adapter: listShipments
    tags: [shipments, pagination]
    oas:
      operationId: ListShipments
    inputs:
      - name: page
        type: integer
        optional: true
      - name: pageSize
        type: integer
        default: 25
        constraints:
          min: 1
          max: 100
      - name: createdGte
        type: string
        optional: true
        description: Only shipments created at or after this ISO 8601 UTC time
    outputs:
      - name: shipments
        type: shipment[]
        elementFields:
          - name: shipmentId
            type: string
          - name: status
            type: string
      - name: count
        type: integer
        display: Shipments
      - name: ourCount
        type: integer
        display: Ours
      - name: liveCount
        type: integer
      - name: nextPage
        type: integer
        optional: true

  listShipmentRates:
    description: >-
      The rates a shipment was quoted (GET /shipments/{id}/rates, 200), each with a carrier, a
      service level, a price, and an estimate in days. Shippo marks the standouts in `attributes`:
      CHEAPEST, FASTEST, and BESTVALUE, which is not always present — on a lane where one rate is
      both cheapest and fastest, only those two appear. Proven by plans/rating/rate-shop.yaml.
    adapter: listShipmentRates
    tags: [rating]
    oas:
      operationId: ListShipmentRates
    inputs:
      - name: shipmentId
        type: string
        default:
          from: createShipment.shipmentId
      - name: page
        type: integer
        optional: true
      - name: pageSize
        type: integer
        default: 100
        constraints:
          min: 1
          max: 100
    outputs:
      - name: rates
        type: rate[]
        elementFields:
          - name: rateId
            type: string
          - name: provider
            type: string
          - name: amount
            type: string
      - name: count
        type: integer
        display: Rates
      - name: providers
        type: string
        description: The carriers that answered, sorted and comma-joined
      - name: currency
        type: string
        description: The currency the rates are quoted in; "" when there are none
      - name: cheapestRateId
        type: string
        description: The rate marked CHEAPEST; "" when none is
      - name: cheapestProvider
        type: string
      - name: cheapestAmount
        type: string
        display: Cheapest
      - name: fastestProvider
        type: string
        description: The carrier of the rate marked FASTEST; "" when none is
      - name: attributeCount
        type: integer
        description: Rates carrying at least one attribute

  listShipmentRatesByCurrency:
    description: >-
      The same rates converted (GET /shipments/{id}/rates/{currency}, 200). Each rate keeps `amount`
      and `currency` as quoted and adds `amount_local` and `currency_local` in the currency asked
      for, so a US shipment's 63.94 USD reads 55.40 EUR beside it. Proven by
      plans/rating/currencies.yaml.
    adapter: listShipmentRatesByCurrency
    tags: [rating]
    oas:
      operationId: ListShipmentRatesByCurrencyCode
    inputs:
      - name: shipmentId
        type: string
        default:
          from: createShipment.shipmentId
      - name: currencyCode
        type: string
        default: EUR
        description: An ISO 4217 code
      - name: pageSize
        type: integer
        default: 100
        constraints:
          min: 1
          max: 100
    outputs:
      - name: count
        type: integer
        display: Rates
      - name: currency
        type: string
        description: The currency the rates were quoted in
      - name: currencyLocal
        type: string
        display: In
        description: The currency asked for
      - name: convertedCount
        type: integer
        description: Rates that came back with an amount in the local currency

  getRate:
    description: >-
      Read one rate by its object id (GET /rates/{id}, 200), with everything the listing shows and
      more: the service level's token and terms, the delivery estimate, the carrier's zone, the
      insurance included, and `provider_image_75` and `provider_image_200`, which are https URLs to
      the carrier's logo. `servicelevel.display_name` and `parent_servicelevel` come back null where
      the spec types them strings. Proven by plans/rating/rate-shop.yaml.
    adapter: getRate
    tags: [rating]
    oas:
      operationId: GetRate
    inputs:
      - name: rateId
        type: string
        default:
          from: listShipmentRates.rates
          select:
            strategy: first
            field: rateId
    outputs:
      - name: rateId
        type: string
      - name: provider
        type: string
        display: Carrier
      - name: serviceLevelName
        type: string
      - name: serviceLevelToken
        type: string
      - name: amount
        type: string
        display: Amount
      - name: currency
        type: string
      - name: estimatedDays
        type: integer
        optional: true
      - name: attributes
        type: string
        description: CHEAPEST, FASTEST, BESTVALUE, sorted and comma-joined; "" when none
      - name: zone
        type: string
        description: The carrier's zone for the lane; "" when it gives none
      - name: shipmentId
        type: string
      - name: carrierAccountId
        type: string
      - name: providerImage
        type: string
        description: An https URL to the carrier's logo, which the rates visualizer shows
      - name: test
        type: boolean

  # --- Labels and refunds -----------------------------------------------------------------
  createTransaction:
    description: >-
      Buy a label from a rate (POST /transactions, 201). This is the two-step purchase: rate the
      shipment, then buy one of its rates. A successful transaction carries an https `label_url` to
      the label itself, a carrier tracking number, and a tracking URL; `label_file_type` chooses the
      format, from PNG and ZPLII to PDF at several sizes. A rate older than seven days cannot be
      bought. **Cleanup refunds the label** — a label cannot be deleted, and a refund is the only
      way to un-buy one. Proven by plans/labels/buy-and-refund.yaml.
    adapter: createTransaction
    tags: [labels, transactions]
    oas:
      operationId: CreateTransaction
    # A live token would buy a real label. This is the one mistake a refund cannot undo, so stop at
    # the first one.
    errorDetection:
      - path: test
        rule: equals
        value: false
    inputs:
      - name: rateId
        type: string
        default:
          from: listShipmentRates.rates
          select:
            strategy: first
            field: rateId
      - name: labelFileType
        type: string
        optional: true
        description: >-
          PNG, PNG_2.3x7.5, PDF, PDF_2.3x7.5, PDF_4x6, PDF_4x8, PDF_A4, PDF_A5, PDF_A6, or ZPLII.
          Shippo does not echo it back; the label URL's extension is what says which was delivered.
      - name: async
        type: boolean
        optional: true
        description: 'false buys before answering; Shippo''s default is true'
      - name: metadata
        type: string
        default: aat-shippo
    outputs:
      - name: transactionId
        type: string
        display: Label
      - name: status
        type: string
        description: WAITING, QUEUED, SUCCESS, ERROR, REFUNDED, REFUNDPENDING, or REFUNDREJECTED
      - name: labelUrl
        type: string
        description: An https URL to the label, which the label visualizer shows; "" until it succeeds
      - name: labelFormat
        type: string
        description: >-
          The label URL's extension, lowercased, which is the format actually delivered. Shippo does
          not echo label_file_type on the transaction, so this is read from the URL.
      - name: trackingNumber
        type: string
      - name: trackingUrlProvider
        type: string
      - name: qrCodeUrl
        type: string
        description: An https URL to a QR code; "" unless the carrier offers one
      - name: rateId
        type: string
        description: The rate bought; an Instalabel answers a rate object instead of an id
      - name: parcelId
        type: string
      - name: eta
        type: string
      - name: messageCount
        type: integer
      - name: test
        type: boolean
      - name: metadata
        type: string
    cleanup:
      node: createRefund
      when: 'status == "SUCCESS"'

  createTransactionInstant:
    description: >-
      Buy a label without rating first (POST /transactions, 201) — Shippo calls it an Instalabel. In
      place of a rate it takes the shipment inline, a carrier account, and a service level token, so
      one call does what createShipment and createTransaction do together. The transaction answers a
      rate **object** rather than a rate id, which is how the two purchases differ in their replies.
      **Cleanup refunds the label.** Proven by plans/labels/instalabel.yaml.
    adapter: createTransactionInstant
    tags: [labels, transactions]
    oas:
      operationId: CreateTransaction
    errorDetection:
      - path: test
        rule: equals
        value: false
    inputs:
      - name: addressFrom
        type: string
      - name: addressTo
        type: string
      - name: parcels
        type: string[]
      - name: carrierAccountId
        type: string
      - name: serviceLevelToken
        type: string
        description: A service level of that carrier account, such as usps_priority
      - name: labelFileType
        type: string
        optional: true
      - name: async
        type: boolean
        optional: true
      - name: metadata
        type: string
        default: aat-shippo
    outputs:
      - name: transactionId
        type: string
        display: Label
      - name: status
        type: string
      - name: labelUrl
        type: string
      - name: labelFormat
        type: string
      - name: trackingNumber
        type: string
      - name: trackingUrlProvider
        type: string
      - name: rateProvider
        type: string
        description: The carrier, read from the rate object an Instalabel answers with
      - name: rateAmount
        type: string
      - name: messageCount
        type: integer
      - name: test
        type: boolean
      - name: metadata
        type: string
    cleanup:
      node: createRefund
      when: 'status == "SUCCESS"'

  getTransaction:
    description: >-
      Read a label by its object id (GET /transactions/{id}, 200). This is what a poll reads while a
      purchase is QUEUED or WAITING, and what shows a label's status after it has been refunded.
      Proven by plans/labels/buy-and-refund.yaml.
    adapter: getTransaction
    tags: [labels, transactions]
    oas:
      operationId: GetTransaction
    inputs:
      - name: transactionId
        type: string
        default:
          from: createTransaction.transactionId
    outputs:
      - name: transactionId
        type: string
      - name: status
        type: string
        display: Status
      - name: labelUrl
        type: string
      - name: trackingNumber
        type: string
      - name: messageCount
        type: integer
      - name: test
        type: boolean
      - name: metadata
        type: string

  createRefund:
    description: >-
      Refund a label (POST /refunds, 201), which is the only way to un-buy one: labels cannot be
      deleted. The refund is asynchronous, running QUEUED → PENDING → SUCCESS | ERROR, and in test
      mode it does **not** settle quickly: one stayed PENDING for at least 90 seconds, which matches
      a carrier taking days to accept a refund in the real world. What does happen at once is that
      the label's own status becomes REFUNDPENDING, so that, not the refund's status, is what a plan
      waits for. This is what every label's cleanup runs, and the shape of cleanup throughout the
      package — a refund, never a delete. Proven by plans/labels/buy-and-refund.yaml.
    adapter: createRefund
    tags: [labels, refunds, cleanup]
    oas:
      operationId: CreateRefund
    inputs:
      - name: transactionId
        type: string
        default:
          from: createTransaction.transactionId
      - name: async
        type: boolean
        optional: true
    outputs:
      - name: refundId
        type: string
        display: Refund
      - name: status
        type: string
        description: QUEUED, PENDING, SUCCESS, or ERROR
      - name: transactionId
        type: string
      - name: test
        type: boolean

  getRefund:
    description: >-
      Read a refund by its object id (GET /refunds/{id}, 200), which is what a poll reads while it
      is QUEUED or PENDING. Proven by plans/labels/buy-and-refund.yaml.
    adapter: getRefund
    tags: [refunds]
    oas:
      operationId: GetRefund
    inputs:
      - name: refundId
        type: string
        default:
          from: createRefund.refundId
    outputs:
      - name: refundId
        type: string
      - name: status
        type: string
        display: Status
      - name: transactionId
        type: string
      - name: test
        type: boolean

  listRefunds:
    description: >-
      List the account's refunds (GET /refunds/, 200) — note the trailing slash, which the spec
      declares and the API answers on. The response is a paginated list with `next` and `previous`,
      but **the spec declares no `page` or `results` parameters for this operation**, alone among
      the listings, so the node sends none and reads the first page. Refunds carry no metadata of
      their own, so they are matched to the package by the label they refund. Proven by
      plans/labels/buy-and-refund.yaml.
    adapter: listRefunds
    tags: [refunds]
    oas:
      operationId: ListRefunds
    outputs:
      - name: refunds
        type: refund[]
        optional: true
        elementFields:
          - name: refundId
            type: string
          - name: status
            type: string
          - name: transactionId
            type: string
      - name: count
        type: integer
        display: Refunds
      - name: liveCount
        type: integer
      - name: nextPage
        type: integer
        optional: true

  # --- Tracking ---------------------------------------------------------------------------
  createTrack:
    description: >-
      Register a tracking number so Shippo watches it and fires `track_updated` webhooks
      (POST /tracks, **200**, not the 201 a create usually answers). The response is a full Track,
      the same shape GetTrack returns, so registering and reading tell you the same thing — the
      difference is that registering subscribes. Registering a number already registered answers
      200 again rather than a conflict. Proven by plans/tracking/register.yaml.
    adapter: createTrack
    tags: [tracking]
    oas:
      operationId: CreateTrack
    inputs:
      - name: carrier
        type: string
        default: shippo
        description: The carrier token; `shippo` serves the deterministic test fixtures
      - name: trackingNumber
        type: string
        default: SHIPPO_TRANSIT
      - name: metadata
        type: string
        optional: true
        description: >-
          Up to 100 characters. A fixture ignores it and answers Shippo's own
          "Shippo test tracking", so a tracked fixture cannot carry this package's tag.
    outputs:
      - name: carrier
        type: string
      - name: trackingNumber
        type: string
        display: Tracking
      - name: status
        type: string
        display: Status
        description: UNKNOWN, PRE_TRANSIT, TRANSIT, DELIVERED, RETURNED, or FAILURE
      - name: statusDetails
        type: string
      - name: historyCount
        type: integer
        display: History
      - name: metadata
        type: string

  getTrack:
    description: >-
      Read a tracking status by carrier and tracking number
      (GET /tracks/{Carrier}/{TrackingNumber}, 200). Carrier `shippo` with one of six
      `SHIPPO_*` numbers returns a fixed, deterministic history that never flakes and costs
      nothing, which is what the tracking layers cross. The six are a **cumulative chain**, not
      six independent states: UNKNOWN(1) → TRANSIT(2) → FAILURE(3) → DELIVERED(4) → RETURNED(5),
      with PRE_TRANSIT its own single entry. `eta` and `original_eta` are relative to now and move
      on every call, so nothing asserts them. Proven by plans/tracking/fixtures.yaml.
    adapter: getTrack
    tags: [tracking]
    oas:
      operationId: GetTrack
    inputs:
      - name: carrier
        type: string
        default: shippo
        description: The carrier token; `shippo` serves the test fixtures
      - name: trackingNumber
        type: string
        default: SHIPPO_TRANSIT
        description: >-
          SHIPPO_PRE_TRANSIT, SHIPPO_TRANSIT, SHIPPO_DELIVERED, SHIPPO_RETURNED, SHIPPO_FAILURE
          or SHIPPO_UNKNOWN for a fixture, or a real carrier number from a bought label
    outputs:
      - name: carrier
        type: string
      - name: trackingNumber
        type: string
        display: Tracking
      - name: status
        type: string
        display: Status
      - name: statusDetails
        type: string
      - name: historyCount
        type: integer
        display: History
        description: Entries in tracking_history; a deterministic count for each fixture
      - name: historyStatuses
        type: string
        description: The history's statuses in order, comma-joined — the chain the fixture walked
      - name: lastHistoryStatus
        type: string
        description: The final history entry's status, which is what tracking_status reports now
      - name: hasLocation
        type: boolean
        description: >-
          Whether tracking_status.location came back. Null on PRE_TRANSIT and UNKNOWN, set on the
          rest; the spec declares it non-nullable either way.
      - name: serviceToken
        type: string
      - name: transactionId
        type: string
        description: >-
          The owning transaction, visible only to its owner. Null on a fixture, though the spec
          declares it a string.
      - name: metadata
        type: string
      - name: messageCount
        type: integer

  # --- Webhooks ---------------------------------------------------------------------------
  createWebhook:
    description: >-
      Register a webhook endpoint (POST /webhooks, 201). Shippo asks for nothing but a URL — there
      is no verification handshake, no challenge, and no ping — so the whole lifecycle is drivable
      without a receiver, which is how this package tests it. **No secret is issued**: the Webhook
      object carries no signing key, so there is nothing here to redact. `event: all` is stored and
      **read back as `*`**, a value the spec's own enum does not list. Cleanup deletes it.
      Proven by plans/webhooks/lifecycle.yaml.
    adapter: createWebhook
    tags: [webhooks]
    oas:
      operationId: createWebhook
    inputs:
      - name: event
        type: string
        default: track_updated
        description: >-
          transaction_created, transaction_updated, track_updated, batch_created, batch_purchased,
          or all — which comes back as `*`
      - name: url
        type: string
        description: >-
          Any https URL; Shippo never calls it during a test run. The plans pass
          {{env.webhookUrl}}, whose path carries aat-shippo — the only tag a webhook can have.
      - name: active
        type: boolean
        default: true
      - name: isTest
        type: boolean
        default: true
    outputs:
      - name: webhookId
        type: string
        display: Webhook
      - name: event
        type: string
        display: Event
      - name: url
        type: string
      - name: active
        type: boolean
      - name: isTest
        type: boolean
      - name: objectUpdated
        type: string
        description: Set on create, and **not bumped by an update** — see plans/webhooks/lifecycle.yaml
    cleanup:
      node: deleteWebhook

  getWebhook:
    description: >-
      Read one webhook by its object id (GET /webhooks/{webhookId}, 200). After a delete the same
      read answers 404 with Shippo's flat `{"detail": "Not found."}`.
      Proven by plans/webhooks/lifecycle.yaml.
    adapter: getWebhook
    tags: [webhooks]
    oas:
      operationId: getWebhook
    inputs:
      - name: webhookId
        type: string
        default:
          from: createWebhook.webhookId
    outputs:
      - name: webhookId
        type: string
        display: Webhook
      - name: event
        type: string
      - name: url
        type: string
      - name: active
        type: boolean
      - name: isTest
        type: boolean
      - name: objectUpdated
        type: string

  updateWebhook:
    description: >-
      Replace a webhook's settings (PUT /webhooks/{webhookId}, 200). The body is a whole webhook,
      not a patch. **`object_updated` does not move** — the object answers with the timestamp it
      was created at, so an update leaves no trace in the object itself.
      Proven by plans/webhooks/lifecycle.yaml.
    adapter: updateWebhook
    tags: [webhooks]
    oas:
      operationId: updateWebhook
    inputs:
      - name: webhookId
        type: string
        default:
          from: createWebhook.webhookId
      - name: event
        type: string
        default: track_updated
      - name: url
        type: string
        description: The plans pass {{env.webhookUrl}}
      - name: active
        type: boolean
        default: false
      - name: isTest
        type: boolean
        default: true
    outputs:
      - name: webhookId
        type: string
        display: Webhook
      - name: event
        type: string
      - name: url
        type: string
      - name: active
        type: boolean
        display: Active
      - name: isTest
        type: boolean
      - name: objectUpdated
        type: string

  listWebhooks:
    description: >-
      List the account's webhooks (GET /webhooks, 200). The spec declares **no `page` or `results`
      parameters** for this listing, alone with GET /refunds/, so this node sends none and asserts
      the response carries no `next` — a guard that cannot page must prove it did not need to. (The
      API does honour both parameters if you send them; the spec is what is wrong, and sending an
      undeclared parameter would be the caller's fault rather than the spec's.) A Webhook carries no
      `metadata`, so a webhook is recognised as this package's by `aat-shippo` in its URL.
      Proven by plans/webhooks/lifecycle.yaml and plans/zz-guard/no-stray-webhooks.yaml.
    adapter: listWebhooks
    tags: [webhooks, pagination, guard]
    oas:
      operationId: listWebhooks
    inputs: []
    outputs:
      - name: webhooks
        type: webhook[]
        elementFields:
          - name: webhookId
            type: string
          - name: event
            type: string
          - name: url
            type: string
      - name: count
        type: integer
        display: Webhooks
      - name: ourCount
        type: integer
        display: Ours
        description: Webhooks whose URL carries aat-shippo
      - name: liveCount
        type: integer
        description: Webhooks not marked is_test; 0 for anything this package registers

  deleteWebhook:
    description: >-
      Delete a webhook (DELETE /webhooks/{webhookId}, **204** with no body). Webhooks are the one
      thing this package creates that Shippo lets it destroy, so this is real cleanup rather than
      the refund every label needs. Paired to createWebhook in the graph.
      Proven by plans/webhooks/lifecycle.yaml.
    adapter: deleteWebhook
    tags: [webhooks, cleanup]
    oas:
      operationId: deleteWebhook
    inputs:
      - name: webhookId
        type: string
        default:
          from: createWebhook.webhookId
    outputs: []

  # --- User parcel templates --------------------------------------------------------------
  createUserParcelTemplate:
    description: >-
      Save a parcel shape to reuse (POST /user-parcel-templates, **201**, where the spec declares
      200). The body is a `oneOf`: either a `template` token from a carrier's own parcel templates
      with a weight, or a full set of dimensions with a name. This node writes the dimension form.
      **This family's timestamps are not ISO 8601** — `object_created` comes back as
      `2026-09-16 13:23:18.665011 +0000 UTC`, Go's default time format, where the rest of this API
      sends ISO 8601. Reading it back gives the same thing; fetching the very same object through
      the default-parcel-template setting gives ISO 8601, so one object has two renderings. A
      UserParcelTemplate carries no `metadata` and no `test`, so this package tags it by name
      instead. Cleanup deletes it. Proven by plans/account/parcel-templates.yaml.
    adapter: createUserParcelTemplate
    tags: [account, parcels]
    oas:
      operationId: CreateUserParcelTemplate
    inputs:
      - name: name
        type: string
        default: aat-shippo template
        description: >-
          The only tag this object can carry: it has no metadata field, so the guard and the
          plans recognise their own by an aat-shippo name prefix.
      - name: length
        type: string
        default: "10"
      - name: width
        type: string
        default: "8"
      - name: height
        type: string
        default: "4"
      - name: distanceUnit
        type: string
        default: in
      - name: weight
        type: string
        default: "2"
      - name: weightUnit
        type: string
        default: lb
    outputs:
      - name: templateId
        type: string
        display: Template
      - name: name
        type: string
        display: Name
      - name: length
        type: string
      - name: width
        type: string
      - name: height
        type: string
      - name: distanceUnit
        type: string
      - name: weight
        type: string
      - name: weightUnit
        type: string
      - name: createdIsIso
        type: boolean
        description: >-
          Whether object_created parsed as ISO 8601. False on a create — the one endpoint in this
          API that answers a Go-formatted timestamp.
    cleanup:
      node: deleteUserParcelTemplate

  getUserParcelTemplate:
    description: >-
      Read one saved parcel shape (GET /user-parcel-templates/{id}, 200). Renders its timestamps
      in the same non-ISO format the create does, and carries the carrier `template` it was built
      from — null for one built from dimensions, though the spec declares an object.
      Proven by plans/account/parcel-templates.yaml.
    adapter: getUserParcelTemplate
    tags: [account, parcels]
    oas:
      operationId: GetUserParcelTemplate
    inputs:
      - name: templateId
        type: string
        default:
          from: createUserParcelTemplate.templateId
    outputs:
      - name: templateId
        type: string
        display: Template
      - name: name
        type: string
        display: Name
      - name: length
        type: string
      - name: width
        type: string
      - name: height
        type: string
      - name: weight
        type: string
      - name: isDefault
        type: boolean
        description: >-
          Shippo's own flag, which stays false even for the template that **is** the account's
          default — the default lives under /live-rates/settings, not here
      - name: createdIsIso
        type: boolean

  updateUserParcelTemplate:
    description: >-
      Change a saved parcel shape (PUT /user-parcel-templates/{id}, 200). The body is optional in
      the spec and a whole template in practice. Proven by plans/account/parcel-templates.yaml.
    adapter: updateUserParcelTemplate
    tags: [account, parcels]
    oas:
      operationId: UpdateUserParcelTemplate
    inputs:
      - name: templateId
        type: string
        default:
          from: createUserParcelTemplate.templateId
      - name: name
        type: string
        default: aat-shippo template resized
      - name: length
        type: string
        default: "12"
      - name: width
        type: string
        default: "9"
      - name: height
        type: string
        default: "6"
      - name: distanceUnit
        type: string
        default: in
      - name: weight
        type: string
        default: "3"
      - name: weightUnit
        type: string
        default: lb
    outputs:
      - name: templateId
        type: string
        display: Template
      - name: name
        type: string
        display: Name
      - name: length
        type: string
      - name: width
        type: string
      - name: height
        type: string
      - name: weight
        type: string

  listUserParcelTemplates:
    description: >-
      List the account's saved parcel shapes (GET /user-parcel-templates, 200). The response is a
      bare `{results}` with **no `count`, `next` or `previous`** — alone among this API's listings —
      and takes no paging parameters. **When the account has none, `results` is `null` rather than
      an empty array**, which the spec's array type disallows. Counts this package's own by their
      aat-shippo name prefix, since the object has no metadata.
      Proven by plans/account/parcel-templates.yaml.
    adapter: listUserParcelTemplates
    tags: [account, parcels, guard]
    oas:
      operationId: ListUserParcelTemplates
    inputs: []
    outputs:
      - name: templates
        type: userParcelTemplate[]
        elementFields:
          - name: templateId
            type: string
          - name: name
            type: string
      - name: count
        type: integer
        display: Templates
        description: Derived by counting results, which the response does not report itself
      - name: ourCount
        type: integer
        display: Ours
        description: Templates whose name starts aat-shippo

  deleteUserParcelTemplate:
    description: >-
      Delete a saved parcel shape (DELETE /user-parcel-templates/{id}, **204** with no body).
      Paired to createUserParcelTemplate in the graph.
      Proven by plans/account/parcel-templates.yaml.
    adapter: deleteUserParcelTemplate
    tags: [account, parcels, cleanup]
    oas:
      operationId: DeleteUserParcelTemplate
    inputs:
      - name: templateId
        type: string
        default:
          from: createUserParcelTemplate.templateId
    outputs: []

  # --- Service groups ---------------------------------------------------------------------
  createServiceGroup:
    description: >-
      Create a shipping option to show at checkout (POST /service-groups, 201). A group bundles
      service levels from carrier accounts under one customer-facing name and price: `FLAT_RATE`,
      `LIVE_RATE` or `FREE_SHIPPING`. Its `service_levels` name an account and one of that
      account's service level tokens, which are visible **only** through the carrier account
      listing with `service_levels: true`, so this node is wired from there. `flat_rate` is
      normalised on the way in — "5.00" comes back "5". A ServiceGroup carries no `metadata` and no
      `test`, so this package tags it by name. Cleanup deletes it.
      Proven by plans/account/service-groups.yaml.
    adapter: createServiceGroup
    tags: [account, rating]
    oas:
      operationId: CreateServiceGroup
    inputs:
      - name: name
        type: string
        default: aat-shippo flat rate
        description: Shown to the customer, and the only tag this object can carry
      - name: description
        type: string
        default: aat-shippo test service group
      - name: type
        type: string
        default: FLAT_RATE
        description: LIVE_RATE, FLAT_RATE, or FREE_SHIPPING
      - name: flatRate
        type: string
        default: "5.00"
        description: Required unless the type is FREE_SHIPPING — a rule the schema states in prose
      - name: flatRateCurrency
        type: string
        default: USD
      - name: accountObjectId
        type: string
        default:
          from: listCarrierAccounts.accounts
          select:
            strategy: match
            field: carrierAccountId
            filter: carrier == "usps"
      - name: serviceLevelToken
        type: string
        default: usps_first_class_mail_letter
    outputs:
      - name: serviceGroupId
        type: string
        display: Group
      - name: name
        type: string
        display: Name
      - name: type
        type: string
      - name: flatRate
        type: string
        description: Normalised — "5.00" goes out and "5" comes back
      - name: flatRateCurrency
        type: string
      - name: isActive
        type: boolean
      - name: serviceLevelCount
        type: integer
    cleanup:
      node: deleteServiceGroup

  updateServiceGroup:
    description: >-
      Change a service group (**PUT /service-groups**, 200) — with **no path parameter**: the
      group is named by `object_id` in the body, alone among this API's updates. `is_active` is
      required, and **sending it as false is rejected exactly as if it were missing**
      (`{"is_active": ["field is required"]}`, 400), so a service group cannot be deactivated
      through its own update endpoint. Proven by plans/account/service-groups.yaml.
    adapter: updateServiceGroup
    tags: [account, rating]
    oas:
      operationId: UpdateServiceGroup
    inputs:
      - name: serviceGroupId
        type: string
        default:
          from: createServiceGroup.serviceGroupId
        description: Sent in the body as object_id, because the path carries no id
      - name: name
        type: string
        default: aat-shippo flat rate renamed
      - name: description
        type: string
        default: aat-shippo test service group
      - name: type
        type: string
        default: FLAT_RATE
      - name: flatRate
        type: string
        default: "6.50"
      - name: flatRateCurrency
        type: string
        default: USD
      - name: isActive
        type: boolean
        default: true
        description: Required, and false is read as absent
      - name: accountObjectId
        type: string
        default:
          from: listCarrierAccounts.accounts
          select:
            strategy: match
            field: carrierAccountId
            filter: carrier == "usps"
      - name: serviceLevelToken
        type: string
        default: usps_first_class_mail_letter
    outputs:
      - name: serviceGroupId
        type: string
        display: Group
      - name: name
        type: string
        display: Name
      - name: flatRate
        type: string
      - name: isActive
        type: boolean

  listServiceGroups:
    description: >-
      List the account's service groups (GET /service-groups, 200). The response is a **bare JSON
      array**, with no envelope, no count and no paging — the only listing in this API shaped that
      way. Counts this package's own by their aat-shippo name prefix.
      Proven by plans/account/service-groups.yaml.
    adapter: listServiceGroups
    tags: [account, rating, guard]
    oas:
      operationId: ListServiceGroups
    inputs: []
    outputs:
      - name: groups
        type: serviceGroup[]
        elementFields:
          - name: serviceGroupId
            type: string
          - name: name
            type: string
      - name: count
        type: integer
        display: Groups
      - name: ourCount
        type: integer
        display: Ours
        description: Groups whose name starts aat-shippo

  deleteServiceGroup:
    description: >-
      Delete a service group (DELETE /service-groups/{id}, **204** with no body). The delete does
      take a path id, where the update does not. Paired to createServiceGroup in the graph.
      Proven by plans/account/service-groups.yaml.
    adapter: deleteServiceGroup
    tags: [account, rating, cleanup]
    oas:
      operationId: DeleteServiceGroup
    inputs:
      - name: serviceGroupId
        type: string
        default:
          from: createServiceGroup.serviceGroupId
    outputs: []

  # --- Rates at checkout ------------------------------------------------------------------
  updateDefaultParcelTemplate:
    description: >-
      Set the parcel a live-rate request uses when it names none
      (PUT /live-rates/settings/parcel-template, 200). The body is just an `object_id`, and the
      response wraps the whole template in a single-key `{result}` envelope — a shape nothing else
      in this API uses. Note the template's own `is_default` stays false: this setting is the only
      thing that knows. Cleanup clears it. Proven by plans/account/live-rates.yaml.
    adapter: updateDefaultParcelTemplate
    tags: [account, rating]
    oas:
      operationId: UpdateDefaultParcelTemplate
    inputs:
      - name: templateId
        type: string
        default:
          from: createUserParcelTemplate.templateId
    outputs:
      - name: templateId
        type: string
        display: Default
      - name: name
        type: string
        display: Name
      - name: length
        type: string
      - name: width
        type: string
      - name: height
        type: string
    cleanup:
      node: deleteDefaultParcelTemplate

  getDefaultParcelTemplate:
    description: >-
      Read the account's default parcel template (GET /live-rates/settings/parcel-template, 200).
      **When none is set, `result` is null**, where the spec declares a UserParcelTemplate object.
      Proven by plans/account/live-rates.yaml.
    adapter: getDefaultParcelTemplate
    tags: [account, rating]
    oas:
      operationId: GetDefaultParcelTemplate
    inputs: []
    outputs:
      - name: templateId
        type: string
        description: 'Empty when no default is set, which is how the account starts and ends'
      - name: name
        type: string
        display: Default
      - name: isSet
        type: boolean
        display: Set

  deleteDefaultParcelTemplate:
    description: >-
      Clear the account's default parcel template
      (DELETE /live-rates/settings/parcel-template, **204**). It takes no id — there is only one
      setting — and it clears the setting without deleting the template it pointed at. Paired to
      updateDefaultParcelTemplate in the graph. Proven by plans/account/live-rates.yaml.
    adapter: deleteDefaultParcelTemplate
    tags: [account, rating, cleanup]
    oas:
      operationId: DeleteDefaultParcelTemplate
    inputs: []
    outputs: []

  createLiveRate:
    description: >-
      Ask what to show a customer at checkout (POST /live-rates, 200). This is not a rate shop:
      **the options it returns are service groups, not carrier services** — each `title` is a
      group's name and each `amount` its configured price — so it answers nothing at all until a
      service group exists. Omitting `parcel` uses the account's default parcel template, which is
      what makes that setting worth having. `address_from` is **required in practice** although the
      spec marks it optional; without one the request is refused with an error in a third shape,
      `{"message", "details"}`, rather than Shippo's usual flat `{"detail"}`.
      Proven by plans/account/live-rates.yaml.
    adapter: createLiveRate
    tags: [account, rating]
    oas:
      operationId: CreateLiveRate
    inputs:
      - name: addressFromStreet1
        type: string
        default: 215 Clayton St
      - name: addressFromCity
        type: string
        default: San Francisco
      - name: addressFromState
        type: string
        default: CA
      - name: addressFromZip
        type: string
        default: "94117"
      - name: addressFromCountry
        type: string
        default: US
      - name: addressToStreet1
        type: string
        default: 233 E Wacker Dr
      - name: addressToCity
        type: string
        default: Chicago
      - name: addressToState
        type: string
        default: IL
      - name: addressToZip
        type: string
        default: "60601"
      - name: addressToCountry
        type: string
        default: US
      - name: itemTitle
        type: string
        default: aat-shippo widget
      - name: itemQuantity
        type: integer
        default: 1
      - name: itemPrice
        type: string
        default: "20.00"
      - name: itemCurrency
        type: string
        default: USD
      - name: itemWeight
        type: string
        default: "1"
      - name: itemWeightUnit
        type: string
        default: lb
    outputs:
      - name: count
        type: integer
        display: Options
      - name: titles
        type: string
        display: Offered
        description: Each option's title, comma-joined — these are service group names
      - name: firstAmount
        type: string
      - name: firstCurrency
        type: string

  # --- Platform accounts ------------------------------------------------------------------
  listShippoAccounts:
    description: >-
      List the Shippo managed accounts under this one (GET /shippo-accounts, 200). **Creating one
      is gated**: POST answers 403 with the bare JSON string "Unauthorized to create accounts" —
      a third error envelope again — on a standard test token, and the API offers no DELETE at all,
      so this package reads and never writes. Its pagination is its own too: `next` and `previous`
      come back as **empty strings** where every other listing sends null, and the `count` the spec
      declares is absent. Proven by plans/account/platform-accounts.yaml.
    adapter: listShippoAccounts
    tags: [account, pagination]
    oas:
      operationId: ListShippoAccounts
    inputs: []
    outputs:
      - name: accounts
        type: shippoAccount[]
        elementFields:
          - name: accountId
            type: string
          - name: email
            type: string
      - name: count
        type: integer
        display: Accounts
        description: Derived by counting results; the response omits the count the spec declares
      - name: ourCount
        type: integer
        display: Ours
        description: Accounts this package created, which is always 0 — creating them is gated

  # --- Carrier account writes -------------------------------------------------------------
  updateCarrierAccount:
    description: >-
      Change a carrier account's settings (PUT /carrier_accounts/{id}, 200). `carrier` and
      `account_id` together identify the account and cannot be changed, so on a Shippo-provided
      test account the one thing worth writing is `active`. This package toggles it on
      **couriersplease**, which docs/carrier-lane-coverage.md records as answering no lane at all —
      so turning it off cannot change what any other plan is quoted. Cleanup turns it back on.
      Proven by plans/account/carrier-writes.yaml.
    adapter: updateCarrierAccount
    tags: [account, carriers]
    oas:
      operationId: UpdateCarrierAccount
    inputs:
      - name: carrierAccountId
        type: string
        default:
          from: listCarrierAccounts.accounts
          select:
            strategy: match
            field: carrierAccountId
            filter: carrier == "couriersplease"
      - name: carrier
        type: string
        default: couriersplease
      - name: accountId
        type: string
        description: Shippo's own id for the account, which is echoed back rather than changed
      - name: active
        type: boolean
        default: false
    outputs:
      - name: carrierAccountId
        type: string
        display: Account
      - name: carrier
        type: string
      - name: active
        type: boolean
        display: Active
      - name: test
        type: boolean

  getCarrierRegistrationStatus:
    description: >-
      Ask how far a carrier registration has got (GET /carrier_accounts/reg-status/, 200). **The
      trailing slash is required** — without it Shippo answers 301 to the same path with one, as
      GET /refunds/ does — and the spec declares the path without it. On an account whose carriers
      are all Shippo-provided there is nothing registering, so the answer is an empty object:
      the registration flow belongs to accounts you bring yourself.
      Proven by plans/account/carrier-writes.yaml.
    adapter: getCarrierRegistrationStatus
    tags: [account, carriers]
    oas:
      operationId: GetCarrierRegistrationStatus
    inputs:
      - name: carrier
        type: string
        default: usps
    outputs:
      - name: status
        type: string
        display: Status
        description: '"" on a Shippo-provided account, which has nothing to register'
      - name: isEmpty
        type: boolean
        description: Whether the body came back as the empty object
