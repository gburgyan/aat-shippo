name: nightly run

# Runs the whole project against Shippo's live test API once a day, so the numbers in the README are
# reproducible from this repository. Skips when the repository has no token. Each batch is uploaded as
# a .aab, so what the API actually said opens with `aat web view <batch>.aab`.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  batch:
    runs-on: ubuntu-latest
    env:
      AAT_VERSION: 0.2.0
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.SHIPPO_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "SHIPPO_API_TOKEN is not set; nothing to run"; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - name: Install aat
        if: steps.token.outputs.present == 'true'
        run: |
          curl -fsSL "https://github.com/gburgyan/aat/releases/download/v${AAT_VERSION}/aat_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin aat
          aat --version
      - name: Validate
        if: steps.token.outputs.present == 'true'
        run: aat validate --strict
      - name: Run every plan
        if: steps.token.outputs.present == 'true'
        env:
          SHIPPO_API_TOKEN: ${{ secrets.SHIPPO_API_TOKEN }}
        run: aat run batch --env test-ci

      # The project's own name, so the file says which API it came from.
      - name: Pack each batch as a .aab
        id: pack
        if: always() && steps.token.outputs.present == 'true'
        run: |
          shopt -s nullglob
          project=$(sed -n 's/^name:[[:space:]]*//p' aat-project.yaml | head -1 | tr -d "\"'")
          for dir in _output/runs/batch-*; do
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/${project}-${dir##*/}.aab" . -i '*.json')
          done
          packed=(./*.aab)
          base=""
          if [ ${#packed[@]} -eq 0 ]; then
            echo "no batch to pack"
          else
            ls -l "${packed[@]}"
            if [ ${#packed[@]} -eq 1 ]; then
              base=$(basename "${packed[0]}" .aab)
            fi
          fi
          # The artifact is named for the file it holds, so the download is not a
          # zip called something else with a zip inside it.
          echo "artifact=${base:-${project}-archives}" >> "$GITHUB_OUTPUT"

      - name: Say how to open it
        if: always() && steps.token.outputs.present == 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Run archives

          Every request and response of this batch, as AAT recorded it. With aat 0.2.0
          or later on your PATH:

          ```
          aat web view ${{ steps.pack.outputs.artifact }}.aab
          ```

          It opens in the browser straight from the file -- in memory, nothing unpacked.

          AAT redacts every credential it sent before writing an archive. Nothing Shippo
          returns is a credential: `token`, `extended_token` and `servicelevel_token` are
          carrier service identifiers such as `usps_priority`, not secrets.
          EOF

      # A failed run is when these are worth opening most, so they upload either way.
      - name: Upload the run archives
        if: always() && steps.token.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: ./*.aab
          if-no-files-found: warn
          retention-days: 14
