visualizers:
  # The rates a shipment was quoted, as a carrier x service table.
  - id: rates
    name: Rates
    file: rates.html
    match:
      node: listShipmentRates

  # The same table for the rates a shipment carries inline, on the create and on a poll.
  - id: shipment-rates
    name: Rates
    file: rates.html
    match:
      bodyPath: rates

  # The same again for a currency-converted listing.
  - id: rates-in-currency
    name: Rates
    file: rates.html
    match:
      node: listShipmentRatesByCurrency

  # The label itself: a PNG is drawn as the image, a PDF or ZPL gets a link, and whatever the
  # carrier said comes with it.
  - id: label
    name: Label
    file: label.html
    match:
      node: createTransaction

  - id: instalabel
    name: Label
    file: label.html
    match:
      node: createTransactionInstant

  - id: label-read
    name: Label
    file: label.html
    match:
      node: getTransaction
