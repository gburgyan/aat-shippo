# The carrier accounts a test token can rate with: every one active, in test mode, and provided by
# Shippo, so nothing here needs carrier credentials. Then one account read on its own, with its
# service levels.
#
# How many come with a token, and which, is Shippo's to change, and nothing here pins either. The
# token had fifteen until the LSO account disappeared between the nightly runs of 4 and 5 November
# 2026: no notice, and its object id answers 404. What a caller can rely on is the shape of the
# list, not its length. The one carrier this plan needs is USPS, and the read below fails without it.
intent:
  goal: usps
  description: Every carrier account a test token comes with is active, Shippo-provided, and in test mode

execution:
  steps:
    - id: accounts
      node: listCarrierAccounts
      description: Every carrier account on the token, with its service levels
      values:
        serviceLevels: true
        pageSize: 100
      assertions:
        mechanical:
          - type: status
            expect: 200
          - type: predicate
            expr: >-
              count > 0 && activeCount == count && shippoAccountCount == count && liveCount == 0 &&
              serviceLevelCount > 0
          # One page holds them all, so the counts above cover every account on the token.
          - type: fieldAbsent
            path: nextPage

    - id: usps
      node: getCarrierAccount
      dependsOn: [accounts]
      isGoal: true
      description: The USPS account, read on its own, which carries no service levels
      values:
        carrierAccountId:
          from: accounts.accounts
          select:
            strategy: match
            field: carrierAccountId
            filter: carrier == "usps"
      assertions:
        mechanical:
          - type: predicate
            expr: >-
              carrier == "usps" && carrierName == "USPS" && active == true &&
              isShippoAccount == true && test == true
          # A single read leaves service_levels out of the body entirely: the listing above asked
          # for them and got 12 for this account, and this read gets none.
          - type: predicate
            expr: serviceLevelCount == 0 && serviceLevels == ""
          - type: fieldAbsent
            path: service_levels
            raw: true
