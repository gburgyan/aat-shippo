# The same rates in another currency. Shippo keeps the currency a carrier quoted in and adds
# amount_local and currency_local in the one asked for, so a US shipment quoted in USD reads in EUR
# beside it. Asking for the currency it was already quoted in is not an error.
intent:
  goal: inEuros
  description: Rates convert to another currency without losing the one they were quoted in

execution:
  steps:
    - id: from
      node: createAddress
      description: The sender, in San Francisco
      values:
        name: AAT Shippo
        street1: 215 Clayton St.
        city: San Francisco
        state: CA
        zip: "94117"
        country: US
        phone: "+15553419393"
        email: aat-shippo@example.com

    - id: to
      node: createAddress
      dependsOn: [from]
      description: The recipient, in New York
      values:
        name: AAT Recipient
        street1: 350 Fifth Avenue
        city: New York
        state: NY
        zip: "10118"
        country: US
        phone: "+15553419394"
        email: aat-shippo@example.com

    - id: parcel
      node: createParcel
      dependsOn: [to]
      values:
        length: "10"
        width: "8"
        height: "4"
        distanceUnit: in
        weight: "2"
        massUnit: lb

    - id: shipment
      node: createShipment
      dependsOn: [parcel]
      description: Rated before answering, so the rates are there to convert
      values:
        addressFrom: {from: from.addressId}
        addressTo: {from: to.addressId}
        parcels:
          value: ["{{parcel.parcelId}}"]
        async: false
      assertions:
        mechanical:
          - type: predicate
            expr: test == true && status == "SUCCESS" && rateCount > 0

    - id: inDollars
      node: listShipmentRatesByCurrency
      dependsOn: [shipment]
      description: Asked for the currency they were already quoted in
      values:
        shipmentId: {from: shipment.shipmentId}
        currencyCode: USD
      retry:
        max: 3
        on: [429]
      assertions:
        mechanical:
          - type: status
            expect: 200
          - type: predicate
            expr: >-
              count == "{{shipment.rateCount}}" && currency == "USD" &&
              currencyLocal == "USD" && convertedCount == count

    - id: inEuros
      node: listShipmentRatesByCurrency
      dependsOn: [inDollars]
      isGoal: true
      description: The same rates in euros, each keeping its quoted amount
      values:
        shipmentId: {from: shipment.shipmentId}
        currencyCode: EUR
      retry:
        max: 3
        on: [429]
      assertions:
        mechanical:
          - type: predicate
            expr: >-
              count == "{{shipment.rateCount}}" && currency == "USD" &&
              currencyLocal == "EUR" && convertedCount == count
