adapter: updateUserParcelTemplate
protocol: http

request:
  method: PUT
  path: /user-parcel-templates/{{templateId}}
  headers:
    Content-Type: application/json
  body: |-
    {
      "name": "{{name}}",
      "length": "{{length}}",
      "width": "{{width}}",
      "height": "{{height}}",
      "distance_unit": "{{distanceUnit}}",
      "weight": "{{weight}}",
      "weight_unit": "{{weightUnit}}"
    }

response:
  extract:
    templateId: object_id
    name: name
    length: length
    width: width
    height: height
    weight: weight
