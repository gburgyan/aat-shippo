# Shippo in test mode. Every environment calls api.goshippo.com with the API token in
# SHIPPO_API_TOKEN, sent as `Authorization: ShippoToken <token>`. Use a test token
# (shippo_test_...): every node that creates an object fails a response whose `test` is false,
# so a live token stops a plan at its first object instead of buying a real label.
#
# `_shippo` holds what the environments share. `_pinned` sends the API version of the vendored
# spec (openapi/public-api.yaml); `test` and `test-ci` extend it. `test-strict` fails any
# exchange the spec doesn't allow, and `api-default` sends no SHIPPO-API-VERSION at all, so
# Shippo answers at the account's default version. Pick one with --env; the manifest defaults
# to test.
#
# Validation is `auto` rather than `strict` by default because Shippo's spec marks nothing
# nullable while the API sends null constantly: `next` and `previous` on every list, and
# `substatus`, `location` and `transaction` on a track. Every request and response is still
# checked and every finding recorded on the step's OAS tab; drift/ pins the findings under
# test-strict, where they fail.
shared:
  headers:
    Accept: application/json

environments:
  _shippo:
    notes: Shippo test mode. Export SHIPPO_API_TOKEN with a shippo_test_ API token.
    vars:
      # Webhook plans register this URL. Shippo only needs a public HTTPS URL; point it at a
      # receiver you control with --var webhookUrl=... to see deliveries.
      webhookUrl: https://example.com/aat-shippo/webhooks
      # Guard plans look at objects created at or after this time, when the package started,
      # and fail on any live-mode label. Shippo's object_created_gte takes an ISO 8601 UTC
      # date-time, not a Unix time.
      packageEpoch: "2026-09-15T00:00:00Z"
    apiBaseUrl: https://api.goshippo.com
    auth:
      type: apikey
      headerName: Authorization
      # Shippo's own spec declares this scheme on APIKeyHeader:
      #   x-token-prefix: ShippoToken   x-token-format: "ShippoToken {token}"
      valuePrefix: "ShippoToken "
      credentials:
        key:
          source: env
          var: SHIPPO_API_TOKEN
    values:
      webhookUrl: ${webhookUrl}
      packageEpoch: ${packageEpoch}

  # The spec's API version, with every request and response checked against the spec and the
  # findings reported rather than failing a step.
  _pinned:
    extends: _shippo
    vars:
      shippoApiVersion: "2018-02-08"
    headers:
      SHIPPO-API-VERSION: ${shippoApiVersion}
    settings:
      oasValidation: auto

  test:
    extends: _pinned

  # Long batches: the same account, with request starts spaced out. Test mode allows 50 POSTs
  # and 400 single GETs a minute, but only 10 list reads; list steps also retry on 429.
  test-ci:
    extends: test
    notes: Paced for long batches under Shippo's test-mode rate limits.
    settings:
      minRequestInterval: 1200ms

  # The spec's version, with a response the spec doesn't allow failing the step. The drift
  # plans run here to show what Shippo's own spec gets wrong.
  test-strict:
    extends: _pinned
    notes: The spec's version, with OpenAPI findings failing a step rather than being reported.
    settings:
      oasValidation: strict

  # The account's own default API version. Run the drift plans here to see what changes
  # between it and the pinned version.
  api-default:
    extends: _shippo
    notes: No SHIPPO-API-VERSION header; responses come at the account's default API version.
    settings:
      oasValidation: auto
